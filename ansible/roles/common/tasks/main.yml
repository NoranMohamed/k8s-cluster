---
- name: Update all packages
  dnf:
    name: "*"
    state: latest

- name: Generate default containerd config
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Set SystemdCgroup to true
  shell: sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml

- name: Enable and start containerd
  systemd:
    name: containerd
    enabled: true
    state: restarted

- name: Add Kubernetes yum repository
  copy:
    dest: /etc/yum.repos.d/kubernetes.repo
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/v1.29/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/v1.29/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

- name: Install kubelet, kubeadm, kubectl
  dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    disable_excludes: kubernetes

- name: Enable and start kubelet
  systemd:
    name: kubelet
    enabled: true
    state: started

- name: Disable swap immediately
  command: swapoff -a

- name: Remove swap from fstab permanently
  lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    state: absent
    backup: yes

- name: "Load kernel module: overlay"
  command: modprobe overlay
  ignore_errors: yes

- name: "Load kernel module: br_netfilter"
  command: modprobe br_netfilter
  ignore_errors: yes

- name: Set sysctl params for Kubernetes networking
  shell: |
    cat > /etc/sysctl.d/k8s.conf << EOF
    net.bridge.bridge-nf-call-iptables  = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward                 = 1
    EOF
    sysctl --system
