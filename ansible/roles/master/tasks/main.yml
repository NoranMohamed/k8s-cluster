---
- name: Initialize the Kubernetes cluster
  command: >
    kubeadm init
    --pod-network-cidr=192.168.0.0/16
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --apiserver-cert-extra-sans={{ ansible_host }}
    --ignore-preflight-errors=all
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for ec2-user
  file:
    path: /home/ec2-user/.kube
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Copy admin.conf to ec2-user kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ec2-user/.kube/config
    remote_src: true
    owner: ec2-user
    group: ec2-user
    mode: "0644"

- name: Wait for Kubernetes API server to be ready
  become_user: ec2-user
  command: kubectl get nodes
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  register: api_ready
  retries: 20
  delay: 10
  until: api_ready.rc == 0

- name: Install Calico CNI
  become_user: ec2-user
  command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml --validate=false
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config

- name: Wait for all control plane pods to be running
  become_user: ec2-user
  shell: kubectl get pods -n kube-system --no-headers | grep -v Running | grep -v Completed | wc -l
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  register: not_ready_pods
  retries: 20
  delay: 15
  until: not_ready_pods.stdout == "0"

- name: Generate join command for worker
  command: kubeadm token create --print-join-command
  register: join_command
  retries: 5
  delay: 15
  until: join_command.rc == 0

- name: Save join command to local machine
  local_action:
    module: copy
    content: "{{ join_command.stdout }}"
    dest: /tmp/k8s_join_command.sh
